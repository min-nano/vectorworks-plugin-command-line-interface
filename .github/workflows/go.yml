name: go

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# CLI（cli/）の Go のテストとビルド。C++ のテストは cpp.yml が走らせる。
# 整形と go vet は format.yml・lint.yml が行う（docs/format.md・docs/lint.md）。
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Vectorworks の対応 OS (darwin・windows) でのみテストする。
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # -race と併用するため covermode は atomic にする。
      # PowerShell は「.」を区切り文字として解釈し -coverprofile=coverage.out が 2 つの引数として入力されるため、bash で実行する。
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        shell: bash
      # OS ごとに分岐するコード（launch 等）があるので、全 OS の結果を送る（Codecov で重なる）。
      # C++（cpp.yml の cpp）と分けて見られるように、go のフラグを付ける。
      # 第三者の Action なのでコミットに固定する（上げるのは Dependabot）。
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage.out
          flags: go
          fail_ci_if_error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  # NestingDepth のファジング（cli/internal/spool/fuzz_test.go）。OS に依らない純粋な関数なので
  # ubuntu だけで回す。test の go test は種だけを確かめる。
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # -fuzz は 1 回に 1 つの対象しか回せないので、対象ごとに分けて 30 秒ずつ回す。
      - run: go test -run '^$' -fuzz '^FuzzNestingDepth$' -fuzztime 30s ./internal/spool
      - run: go test -run '^$' -fuzz '^FuzzNestingDepthOfRequest$' -fuzztime 30s ./internal/spool
      # 落ちた入力は testdata/fuzz に書かれる。手元で go test -run で再現できるように残す。
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: cli/internal/spool/testdata/fuzz/

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: build
        run: |
          set -eu
          version="$(git describe --always --dirty)"
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "../dist/${os}-${arch}/vw2026${ext}" ./cmd/vw2026
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vw2026
          path: dist/
