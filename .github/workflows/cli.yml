name: cli

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# 整形と go vet は format.yml・lint.yml が行う（docs/format.md・docs/lint.md）。
jobs:
  test:
    strategy:
      fail-fast: false
      # Vectorworks の対応 OS (darwin・windows) でのみテストする。
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
      # -race と併用するため covermode は atomic にする。
      # PowerShell は -coverprofile=coverage.out を「.」で 2 つの引数に分けるため、bash で走らせる。
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        shell: bash
      # OS ごとに分岐するコード（launch など）があるため、全 OS の結果をフラグ付きで送る。
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage.out
          flags: ${{ runner.os }}
          fail_ci_if_error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
      - name: build
        run: |
          set -eu
          version="$(git describe --always --dirty)"
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "../dist/${os}-${arch}/vw2026${ext}" ./cmd/vw2026
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vw2026
          path: dist/
