name: cli

on:
  push:
    branches: [main]
    paths: ["cli/**", "protocol/**", ".github/workflows/cli.yml", "codecov.yml"]
  pull_request:
    paths: ["cli/**", "protocol/**", ".github/workflows/cli.yml", "codecov.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -race と併用するため covermode は atomic にする。
      # PowerShell は -coverprofile=coverage.out を「.」で 2 つの引数に分けるため、bash で走らせる。
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        shell: bash
      # OS ごとに分岐するコード（launch など）があるため、全 OS の結果をフラグ付きで送る。
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage.out
          flags: ${{ runner.os }}
          fail_ci_if_error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: build
        run: |
          set -eu
          version="$(git describe --always --dirty)"
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "../dist/${os}-${arch}/vw2026${ext}" ./cmd/vw2026
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vw2026
          path: dist/
