name: format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Go・clang-format・PSScriptAnalyzer（lint.yml と同じ準備）。
      - uses: ./.github/actions/setup-checks
      - run: scripts/format.sh
        env:
          GOTOOLCHAIN: auto
