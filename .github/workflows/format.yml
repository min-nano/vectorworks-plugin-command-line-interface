name: format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 整形の道具は、開発者の環境で scripts/format.sh を実行するときと同様に、tools/go.mod に
      # 書いた版の Go へ go が切り替えて動かす（GOTOOLCHAIN=auto）。
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            tools/go.sum
            cli/go.sum
      - run: scripts/format.sh
        env:
          GOTOOLCHAIN: auto
