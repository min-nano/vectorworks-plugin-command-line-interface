name: build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# mac と Windows のプラグインのビルド・梱包・リリース（docs/plugin/build-and-release.md）。
# タグはビルドごとに新しく付け、使い回さない。main は 0.0.0-<短い sha> に（latest）、同じリポジトリの
# PR はブランチの head でビルドしたものを dev-<slug>-<PR 番号>-<短い sha> にプレリリースする。
# fork の PR・マージキュー・main 以外の手動の実行はビルドするだけで、公開しない。
# 公開したら、資産を利用者と同じ道筋（既定のレジストリの規則 → マニフェスト → zip）で取ってきて確かめ、
# PR では Windows で入れ替え（install・uninstall）を確かめる。
#
# PR では新しい push が走っているビルドを止める（古い head の公開に意味は無い）。PR が閉じたときは
# cleanup-dev-release.yml が同じグループで走り、走っているビルドを止めてから、その PR の
# プレリリースを消す。PR のグループは github.ref ではなく PR 番号で組む。マージで閉じた
# PR の closed では github.ref が main になり、github.ref で組むと main の push のビルドを止めるため。
# グループの式は cleanup-dev-release.yml と同じものにする（片方だけ変えると同じグループに入らない）。
# 開き直し（reopened）は止めずに待つ。閉じたときの片付けが走っている最中に開き直すと、片付けを
# 途中で止めてタグや消しかけのリリースを残すため。開き直しのビルドが片付けを待っている間に push が
# 来ると、その synchronize のビルドは片付けを止める。片付けは数秒で終わるので、この隙間は残す。
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'reopened' }}

jobs:
  # 刻印・公開先を決め、build.json を書く（mac と Windows の zip に同じものを入れる）。ビルドのジョブは
  # 刻印（version・branch）をここから受け取る。取り出すコミットはビルドのジョブが自分で決め、ここの sha と
  # 同じかを確かめる。
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 同じリポジトリの PR はブランチの head（docs/plugin/build-and-release.md「リリースの形」）。
          # fork の head は信頼できないので、マージのためのコミットをビルドするだけにする。
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          sha="$GITHUB_SHA"
          branch="$GITHUB_REF_NAME"
          tag=""
          title=""
          if [ "$EVENT" = pull_request ]; then
            branch="$HEAD_REF"
            if [ "$SAME_REPO" = true ]; then
              sha="$HEAD_SHA"
              tag="$(scripts/dev-tag.sh "$branch" "$PR_NUMBER" "${sha:0:7}")"
              title="Dev: $branch (${sha:0:7})"
            fi
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            tag="0.0.0-${sha:0:7}"
            title="0.0.0 (${sha:0:7})"
          fi
          version="${sha:0:7}"
          jq -nc --arg version "$version" --arg branch "$branch" '{version: $version, branch: $branch}' > build.json
          cat build.json
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "branch=$branch"
            echo "tag=$tag"
            echo "title=$title"
            echo "publish=$([ -n "$tag" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: build-json
          path: build.json

  # mac の zip: cli.vwlibrary/・build.json・bin/vw2026（universal）・hooks/（sh）。版ごとに作る
  # （docs/plugin/editions.md）。2026 はジョブ名を build-mac のまま（必須のチェック）にし、2025 は
  # build-mac-vw2025 で、Vectorworks 2025 の SDK でプラグインを、ビルドタグ vw2025 で vw2025 をビルドする。
  # 2025 の mac の SDK のヘッダは clang 19 以降で通らないので、どちらも Xcode 16.2 でビルドする。
  build-mac:
    name: ${{ matrix.name }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-mac
            year: "2026"
            zip: cli-macos-arm64.zip
            go-tags: ""
          - name: build-mac-vw2025
            year: "2025"
            zip: cli-vw2025-macos-arm64.zip
            go-tags: vw2025
    runs-on: macos-15
    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/${{ matrix.year }}-NNA-eng-mac-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk
      VERSION: ${{ needs.meta.outputs.version }}
      YEAR: ${{ matrix.year }}
      ARCHIVE: ${{ matrix.zip }}
      GO_TAGS: ${{ matrix.go-tags }}
    steps:
      # 取り出すものは meta の出力に頼らず、ここに条件を書く（同じリポジトリの PR だけ head。fork の
      # PR はマージのためのコミット）。CodeQL が安全だと読めるようにし、meta を変えたときに信頼
      # できないコードを取り出すようになるのを防ぐため。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare-build
        with:
          sha: ${{ needs.meta.outputs.sha }}
          sdk-cache-prefix: vw-sdk-${{ matrix.year }}-mac
      # SDK リファレンスの plugin/ が実機で読み込まれているビルドと同じ Xcode に合わせる。
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: plug-in
        env:
          BRANCH: ${{ needs.meta.outputs.branch }}
        run: |
          set -eu
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VERSION" -DVW_BUILD_BRANCH="$BRANCH"
          cmake --build build --target VwCli --parallel "$(sysctl -n hw.ncpu)"
          # アドホック署名（Developer ID と公証はしない）。.vwr を入れた後にかけ、リソースまで封をする。
          codesign --force --deep --sign - build/cli.vwlibrary
          codesign --verify --strict --verbose=2 build/cli.vwlibrary
          lipo -info build/cli.vwlibrary/Contents/MacOS/cli
          # mac の BuildVWR は固めずに写す（ログは "Release (Copied)"）ので、ファイルとは限らない。
          test -e build/cli.vwlibrary/Contents/Resources/cli.vwr
          ditto build/cli.vwlibrary stage/cli.vwlibrary
      # Go は arm64 のバイナリをリンクのときにアドホック署名する。lipo は各アーキテクチャの署名を保つ。
      # 2025 はビルドタグ vw2025 を付ける（マトリクスの go-tags。コマンド名・環境変数・置き場所・既定のレジストリが 2025 になる）。
      - name: cli
        run: |
          set -eu
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go -C cli build -trimpath -tags "$GO_TAGS" \
              -ldflags "-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/vw$YEAR-$arch" ./cmd/vw2026
          done
          mkdir -p stage/bin
          lipo -create -output "stage/bin/vw$YEAR" "$RUNNER_TEMP/vw$YEAR-arm64" "$RUNNER_TEMP/vw$YEAR-amd64"
          lipo -info "stage/bin/vw$YEAR"
          "stage/bin/vw$YEAR" version
          "stage/bin/vw$YEAR" --help | head -1 | grep -q "^Usage: vw$YEAR "
      # フックは PATH だけを置く（docs/plugin/install-and-update.md「cli のフック」）。mac は sh のものだけ。
      # どの版の zip にも同じフックを入れる（フックは渡された VW<版>_HOOK_* で版を決める）。
      - name: hooks
        run: |
          set -eu
          mkdir -p stage/hooks
          cp scripts/hooks/install.sh scripts/hooks/uninstall.sh scripts/hooks/lib.sh stage/hooks/
      # zip はシンボリックリンクを追って中身を入れる（-y を付けない。install はリンクを断る）。
      - name: package
        run: |
          set -eu
          mkdir -p dist
          (cd stage && zip -qr "../dist/$ARCHIVE" .)
          unzip -Z1 "dist/$ARCHIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}

  # Windows の zip: cli.vlb・cli.vwr・build.json・bin\vw2026.exe・hooks\（PowerShell）。版ごとに作る
  # （build-mac と同じ。2026 は build-windows、2025 は build-windows-vw2025）。
  build-windows:
    name: ${{ matrix.name }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-windows
            year: "2026"
            zip: cli-windows-x64.zip
            go-tags: ""
          - name: build-windows-vw2025
            year: "2025"
            zip: cli-vw2025-windows-x64.zip
            go-tags: vw2025
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/${{ matrix.year }}-NNA-eng-win-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-win
      VERSION: ${{ needs.meta.outputs.version }}
      YEAR: ${{ matrix.year }}
      ARCHIVE: ${{ matrix.zip }}
      GO_TAGS: ${{ matrix.go-tags }}
    steps:
      # 取り出すものは meta の出力に頼らず、ここに条件を書く（同じリポジトリの PR だけ head。fork の
      # PR はマージのためのコミット）。CodeQL が安全だと読めるようにし、meta を変えたときに信頼
      # できないコードを取り出すようになるのを防ぐため。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare-build
        with:
          sha: ${{ needs.meta.outputs.sha }}
          sdk-cache-prefix: vw-sdk-${{ matrix.year }}-win
      - name: plug-in
        env:
          BRANCH: ${{ needs.meta.outputs.branch }}
        run: |
          set -eu
          cmake -S . -B build -A x64 -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="$VERSION" -DVW_BUILD_BRANCH="$BRANCH"
          cmake --build build --config Release --target VwCli --parallel
          cp build/Release/cli.vlb build/Release/cli.vwr stage/
      - name: cli
        run: |
          set -eu
          mkdir -p stage/bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C cli build -trimpath -tags "$GO_TAGS" \
            -ldflags "-s -w -X main.version=$VERSION" -o "../stage/bin/vw$YEAR.exe" ./cmd/vw2026
          "stage/bin/vw$YEAR.exe" version
          "stage/bin/vw$YEAR.exe" --help | head -1 | grep -q "^Usage: vw$YEAR "
      # フックは PATH だけを置く（docs/plugin/install-and-update.md「cli のフック」）。Windows は
      # PowerShell のものだけ。どの版の zip にも同じフックを入れる。
      - name: hooks
        run: |
          set -eu
          mkdir -p stage/hooks
          cp scripts/hooks/install.ps1 scripts/hooks/uninstall.ps1 scripts/hooks/lib.ps1 stage/hooks/
      # .NET の ZipFile は項目の名前の区切りを / にする（Windows PowerShell 5.1 の Compress-Archive は \
      # にするので使わない。install は \ の項目を断る）。
      - name: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$PWD/stage", "$PWD/dist/$env:ARCHIVE")
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/dist/$env:ARCHIVE")
          $zip.Entries.FullName
          $zip.Dispose()
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}

  # マニフェストを書き、下書きのリリースに資産を上げ終えてから公開する（下書きは利用者の URL から
  # 見えないので、資産が揃わない間を見せない。latest は公開した時点で進む）。タグは使い回さない。
  release:
    needs: [meta, build-mac, build-windows]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.publish.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.meta.outputs.sha }}
      TAG: ${{ needs.meta.outputs.tag }}
      TITLE: ${{ needs.meta.outputs.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # 初回のスクリプトは、ビルドしたのと同じコミットから取る。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/get-vw.sh
            scripts/get-vw.ps1
          sparse-checkout-cone-mode: false
      - run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*.zip
          path: dist
          merge-multiple: true
      # マニフェスト（docs/registry.md「マニフェスト」）。版ごとに 1 つ（vw2026.json・vw2025.json。
      # docs/plugin/editions.md）。資産は絶対の参照で、このタグのリリースを指す（同じマニフェストを latest の
      # 場所から取っても、指す zip は変わらない）。
      - name: manifest
        run: |
          set -eu
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          for year in 2026 2025; do
            if [ "$year" = 2026 ]; then
              prefix=cli-
            else
              prefix="cli-vw$year-"
            fi
            mac="$(sha256sum "dist/${prefix}macos-arm64.zip" | cut -d' ' -f1)"
            win="$(sha256sum "dist/${prefix}windows-x64.zip" | cut -d' ' -f1)"
            jq -n --arg tag "$TAG" --arg base "$base" --arg prefix "$prefix" --arg mac "$mac" --arg win "$win" '{
              manifest_version: 1,
              tag: $tag,
              targets: {
                "macos-arm64": {
                  asset: ($base + "/" + $prefix + "macos-arm64.zip"),
                  sha256: $mac,
                  hooks: {install: ["sh", "hooks/install.sh"], uninstall: ["sh", "hooks/uninstall.sh"]}
                },
                "windows-x64": {
                  asset: ($base + "/" + $prefix + "windows-x64.zip"),
                  sha256: $win,
                  hooks: {install: ["powershell", "hooks/install.ps1"], uninstall: ["powershell", "hooks/uninstall.ps1"]}
                }
              }
            }' > "dist/vw$year.json"
            cat "dist/vw$year.json"
          done
      # 初回のスクリプト。雛形（scripts/get-vw.sh・.ps1）の @VW_TAG@ をこのリリースのタグに、@VW_YEAR@ を版に
      # 置き換えて、版ごとに作る（get-vw2026.*・get-vw2025.*。どのリリースから取ったスクリプトも、その
      # リリースのその版の cli を入れる。タグは英数字と . _ - だけなので、sed の置き換えにそのまま書ける）。
      # PowerShell のものは BOM を除いて上げる（Windows PowerShell 5.1 の Invoke-RestMethod は charset の
      # 無い本文を ISO-8859-1 で読むので、BOM が iex に崩れて渡る）。同じ理由で ASCII だけであることを確かめる。
      - name: scripts
        run: |
          set -eu
          for year in 2026 2025; do
            sed -e "s/@VW_TAG@/$TAG/g" -e "s/@VW_YEAR@/$year/g" scripts/get-vw.sh > "dist/get-vw$year.sh"
            sed -e '1s/^\xEF\xBB\xBF//' -e "s/@VW_TAG@/$TAG/g" -e "s/@VW_YEAR@/$year/g" scripts/get-vw.ps1 \
              > "dist/get-vw$year.ps1"
            for script in "dist/get-vw$year.sh" "dist/get-vw$year.ps1"; do
              if ! grep -qF "'$TAG'" "$script" || ! grep -qF "'$year'" "$script" || grep -qF '@VW_' "$script"; then
                echo "$script does not have the tag $TAG and the edition $year" >&2
                exit 1
              fi
            done
            if LC_ALL=C grep -n '[^[:print:][:space:]]' "dist/get-vw$year.ps1"; then
              echo "get-vw$year.ps1 must be ASCII only" >&2
              exit 1
            fi
          done
          ls -l dist
      # 同じタグの公開済みのリリースがあれば、タグが今回の完全な sha を指すなら何もせず（同じ sha の
      # 実行し直し）、違えば失敗にする（短い sha が重なった。docs/plugin/build-and-release.md「リリースの形」）。
      # 下書きのまま残ったもの（前の実行が途中で止まった）は消して作り直す。PR では、同じ PR の別のタグの
      # 下書き（push で止められた前の実行のもの）も消す。タグは公開したときに target の sha に作られる
      # （下書きの間はタグが無い）。
      - id: publish
        run: |
          set -eu
          api="repos/$GH_REPO"
          releases="$(gh api --paginate "$api/releases?per_page=100" | jq -s 'add // []')"
          published="$(printf '%s' "$releases" | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag and (.draft | not))] | length')"
          tagged=false
          if gh api "$api/git/ref/tags/$TAG" > /dev/null 2>&1; then
            tagged=true
          fi
          if [ "$published" -gt 0 ] || [ "$tagged" = true ]; then
            commit="$(gh api "$api/commits/$TAG" --jq .sha)"
            if [ "$commit" != "$SHA" ]; then
              echo "::error::the tag $TAG already points at $commit, not $SHA; lengthen the sha in the tag"
              exit 1
            fi
            if [ "$published" -gt 0 ]; then
              echo "$TAG is already published from $SHA"
              echo "latest=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf '%s' "$releases" |
            jq -r --arg tag "$TAG" --arg pr "$PR_NUMBER" '.[] | select(.draft) | select(
              if $pr == "" then .tag_name == $tag
              else .tag_name | test("^dev-(.*-)?" + $pr + "-[0-9a-f]{7}$") end) | "\(.id) \(.tag_name)"' |
            while read -r id name; do
              echo "removing the draft $name"
              gh api -X DELETE "$api/releases/$id"
            done
          kind=()
          if [ -n "$PR_NUMBER" ]; then
            kind=(--prerelease)
          fi
          gh release create "$TAG" dist/vw2026.json dist/cli-macos-arm64.zip dist/cli-windows-x64.zip \
            dist/get-vw2026.sh dist/get-vw2026.ps1 \
            dist/vw2025.json dist/cli-vw2025-macos-arm64.zip dist/cli-vw2025-windows-x64.zip \
            dist/get-vw2025.sh dist/get-vw2025.ps1 \
            --draft --target "$SHA" --title "$TITLE" --notes "Built from $SHA." "${kind[@]}"
          # 作ったばかりの下書きは、一覧に載るまで少し掛かることがある（載る前に引くと id が無く、公開が
          # 404 になる）。載るまで引き直し、載らなければ失敗にする。
          id=""
          for _ in $(seq 10); do
            # 頁ごとに絞り、最初の 1 行を取る（head で切ると gh が SIGPIPE で落ちうるので、シェルで切る）。
            # $ENV は jq の式で、シェルに展開させない。
            # shellcheck disable=SC2016
            id="$(gh api --paginate "$api/releases?per_page=100" \
              --jq '.[] | select(.draft and .tag_name == $ENV.TAG) | .id')"
            id=${id%%$'\n'*}
            [ -n "$id" ] && break
            sleep 3
          done
          if [ -z "$id" ]; then
            echo "::error::the draft of $TAG does not appear in the list of releases"
            exit 1
          fi
          # latest にするのは、ビルドしたコミットが公開する時点の main の先頭のときだけ（失敗した古い
          # push を後から実行し直したときに、latest が古いコミットへ戻らないため）。
          latest=false
          if [ -z "$PR_NUMBER" ] && [ "$(gh api "$api/commits/main" --jq .sha)" = "$SHA" ]; then
            latest=true
          fi
          gh api -X PATCH "$api/releases/$id" -F draft=false -f make_latest="$latest" > /dev/null
          test "$(gh api "$api/commits/$TAG" --jq .sha)" = "$SHA"
          echo "published $TAG (latest: $latest)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # 公開した資産を、利用者と同じ道筋（既定のレジストリの cli の規則が指すマニフェスト → その asset）で
  # 取ってきて確かめる。版ごと（2026 と 2025。docs/plugin/editions.md）に確かめる。
  verify:
    needs: [meta, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            year: "2026"
          - os: windows-latest
            target: windows-x64
            year: "2026"
          - os: macos-latest
            target: macos-arm64
            year: "2025"
          - os: windows-latest
            target: windows-x64
            year: "2025"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      LATEST: ${{ needs.release.outputs.latest }}
      TARGET: ${{ matrix.target }}
      YEAR: ${{ matrix.year }}
    steps:
      # 規則は CLI に埋め込むのと同じ既定のレジストリ（ビルドしたコミットのもの。版ごとのファイル）から読む。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: cli/internal/registry/default-vw${{ matrix.year }}.json
          sparse-checkout-cone-mode: false
      - env:
          SHA: ${{ needs.meta.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # マニフェストの tag が公開したタグで、zip が sha256 と合う。latest にしたときは、latest の規則でも
      # 同じタグのマニフェストが取れる。
      - name: manifest
        run: |
          set -eu
          # 既定のレジストリの cli の規則の内、最初に合ったものの path（docs/registry.md「規則の選び方」）。
          manifest_url() {
            jq -r --arg tag "$1" '.plugins.cli.manifests
              | map(select(.match as $m | $tag | test("^" + ($m | gsub("\\."; "\\.") | gsub("\\*"; ".*")) + "$")))
              | first | .path | gsub("\\{tag\\}"; $tag)' "cli/internal/registry/default-vw$YEAR.json"
          }
          manifest="$RUNNER_TEMP/vw$YEAR.json"
          curl -fsSL --retry 4 --retry-delay 5 -o "$manifest" "$(manifest_url "$TAG")"
          cat "$manifest"
          test "$(jq -r .tag "$manifest")" = "$TAG"
          asset="$(jq -r --arg t "$TARGET" '.targets[$t].asset' "$manifest")"
          want="$(jq -r --arg t "$TARGET" '.targets[$t].sha256' "$manifest")"
          curl -fL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/release.zip" "$asset"
          # 標準入力から読ませる（Windows の Git Bash の sha256sum は、パスに \ があると行の頭に \ を付ける）。
          if command -v sha256sum > /dev/null; then
            got="$(sha256sum < "$RUNNER_TEMP/release.zip" | cut -d' ' -f1)"
          else
            got="$(shasum -a 256 < "$RUNNER_TEMP/release.zip" | cut -d' ' -f1)"
          fi
          test "$got" = "$want" || { echo "sha256 $got, the manifest says $want"; exit 1; }
          if [ "$LATEST" = true ]; then
            curl -fsSL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/latest.json" "$(manifest_url latest)"
            test "$(jq -r .tag "$RUNNER_TEMP/latest.json")" = "$TAG"
          fi
      # 直下は build.json と bin/・hooks/ と、プラグイン（mac は cli.vwlibrary/、Windows は cli.vlb と cli.vwr）。
      # bin/ の中は CLI だけ、hooks/ の中はその OS のフックだけ。
      - if: runner.os == 'macOS'
        run: |
          set -eu
          zip="$RUNNER_TEMP/release.zip"
          top="$(unzip -Z1 "$zip" | cut -d/ -f1 | sort -u | tr '\n' ' ')"
          test "$top" = "bin build.json cli.vwlibrary hooks " || { echo "unexpected top level: $top"; exit 1; }
          bin="$(unzip -Z1 "$zip" | grep '^bin/.' | tr '\n' ' ')"
          test "$bin" = "bin/vw$YEAR " || { echo "unexpected bin/: $bin"; exit 1; }
          hooks="$(unzip -Z1 "$zip" | grep '^hooks/.' | sort | tr '\n' ' ')"
          test "$hooks" = "hooks/install.sh hooks/lib.sh hooks/uninstall.sh " || { echo "unexpected hooks/: $hooks"; exit 1; }
          dir="$RUNNER_TEMP/release"
          unzip -q "$zip" -d "$dir"
          codesign --verify --strict --verbose=2 "$dir/cli.vwlibrary"
          test -e "$dir/cli.vwlibrary/Contents/Resources/cli.vwr"
          lipo -info "$dir/bin/vw$YEAR"
          echo "RELEASE_DIR=$dir" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = "$env:RUNNER_TEMP/release.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          $names = @($zip.Entries.FullName)
          $zip.Dispose()
          $names
          $top = ($names | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique) -join ' '
          if ($top -cne 'bin build.json cli.vlb cli.vwr hooks') { throw "unexpected top level: $top" }
          $bin = ($names | Where-Object { $_ -like 'bin/?*' }) -join ' '
          if ($bin -cne "bin/vw$env:YEAR.exe") { throw "unexpected bin/: $bin" }
          $hooks = ($names | Where-Object { $_ -like 'hooks/?*' } | Sort-Object) -join ' '
          if ($hooks -cne 'hooks/install.ps1 hooks/lib.ps1 hooks/uninstall.ps1') { throw "unexpected hooks/: $hooks" }
          $dir = "$env:RUNNER_TEMP/release"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dir
          "RELEASE_DIR=$dir" >> $env:GITHUB_ENV
      # mac の初回のスクリプト（公開した get-vw<版>.sh）で、一時の <Plug-Ins> に入れて外す（Windows の初回の
      # スクリプトは install-windows-editions が確かめる）。リンク（~/.local/bin/vw<版>）はランナーのホームに作って
      # 消す（ランナーは使い捨て）。
      - if: runner.os == 'macOS'
        name: first-time script
        run: |
          set -eu
          script="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/get-vw$YEAR.sh"
          plugins="$RUNNER_TEMP/Plug-Ins"
          mkdir -p "$plugins"
          curl -fsSL --retry 4 --retry-delay 5 "$script" | sh -s -- --plugins-dir "$plugins" | tee "$RUNNER_TEMP/install.json"
          test "$(jq -r .outcome "$RUNNER_TEMP/install.json")" = installed
          test "$(jq -r .tag "$RUNNER_TEMP/install.json")" = "$TAG"
          test -x "$plugins/cli/bin/vw$YEAR"
          test -f "$plugins/cli/vw$YEAR-install.json"
          test "$(readlink "$HOME/.local/bin/vw$YEAR")" = "$plugins/cli/bin/vw$YEAR"
          curl -fsSL --retry 4 --retry-delay 5 "$script" | sh -s -- --plugins-dir "$plugins" uninstall | tee "$RUNNER_TEMP/uninstall.json"
          test "$(jq -r .outcome "$RUNNER_TEMP/uninstall.json")" = uninstalled
          test ! -e "$plugins/cli"
          test ! -L "$HOME/.local/bin/vw$YEAR"
      # build.json と CLI の版が、ビルドした sha になっている。CLI はその版のもの（vw2025 は 2025）。
      - run: |
          set -eu
          cat "$RELEASE_DIR/build.json"
          test "$(jq -r .version "$RELEASE_DIR/build.json")" = "$VERSION"
          "$RELEASE_DIR/bin/vw$YEAR" version | tee "$RUNNER_TEMP/version.json"
          test "$(jq -r .version "$RUNNER_TEMP/version.json")" = "$VERSION"
          "$RELEASE_DIR/bin/vw$YEAR" --help | head -1 | grep "^Usage: vw$YEAR "

  # verify の結果を 1 つのチェックにまとめる（必須のチェックにするため）。verify は行列のジョブで、
  # 公開しないとき（マージキュー・fork の PR）は release とともに行列を展開する前に飛ばされ、行列の値の
  # 入った名前のチェックを出さないので、そのままでは必須にできない。公開するときは release と verify が
  # 成功したこと、公開しないときはどちらも飛ばされたことを確かめる。always() にするのは、前のジョブが
  # 失敗・中止したときに、このジョブまで飛ばされて成功として扱われないようにするため。
  verify-result:
    needs: [meta, release, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          META: ${{ needs.meta.result }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
          RELEASE: ${{ needs.release.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          set -eu
          echo "meta: $META, publish: $PUBLISH, release: $RELEASE, verify: $VERIFY"
          test "$META" = success
          if [ "$PUBLISH" = true ]; then
            test "$RELEASE" = success
            test "$VERIFY" = success
          else
            test "$RELEASE" = skipped
            test "$VERIFY" = skipped
          fi

  # 実物の exe の入れ替え（docs/plugin/install-and-update.md「テスト」）。PR の CLI を <Plug-Ins>\cli\ に
  # 入れ、入った PR の CLI に install（タグの違う記録にしてから）と install cli@latest を走らせて、PR の Go の
  # コードに動いている自分をよけさせる（PR でよけ方を壊したら落ちる）。入った CLI の uninstall cli は断り、
  # 初回のスクリプト（その PR のタグの CLI がフォルダの外で走る）で外す。利用者の Path の型と既存の項目が保たれることも
  # 実物のレジストリで確かめる。ランナーは使い捨てなので既定の場所を使い、元の値は戻さない。main では
  # 版の違う相手が無いので走らせない。初回のスクリプトは、利用者と同じく Windows PowerShell 5.1 で、
  # 公開したものを Invoke-RestMethod で取って走らせる。
  # 版ごとに走らせる（docs/plugin/editions.md）。2025 は vw2025 と Vectorworks 2025 の <Plug-Ins> を使う。
  # 必須のチェックは、結果をまとめる install-windows にする（行列のジョブは、飛ばされると行列の値の入った名前の
  # チェックを出さないので、そのままでは必須にできない。verify-result と同じ）。
  install-windows-editions:
    needs: [meta, release]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        year: ["2026", "2025"]
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      YEAR: ${{ matrix.year }}
    steps:
      # 各手順が読み込む関数。場所は vw2026（2025 は vw2025）と同じく OS の決まった場所から求める
      # （docs/plugin/identifiers.md「置き場所」）。
      - name: helpers
        run: |
          @'
          $year = $env:YEAR
          $plugins = Join-Path ([Environment]::GetFolderPath('ApplicationData')) "Nemetschek\Vectorworks\$year\Plug-Ins"
          # <Work> は <Plug-Ins> ごと（install.WorkDirFor: 小文字にした <Plug-Ins> の sha256 の先頭 12 桁。ランナーの
          # <Plug-Ins> の書き方にリンクは無い）。食い違えば、4 の「<Work> がある」の確かめで落ちる。
          $sha = [Security.Cryptography.SHA256]::Create()
          $key = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($plugins.ToLowerInvariant()))[0..5] | ForEach-Object { $_.ToString('x2') })
          $work = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "Temp\vectorworks$year-cli-$key"
          $bin = Join-Path $plugins 'cli\bin'
          $exe = Join-Path $bin "vw$year.exe"

          # vw2026（vw2025）の出力の JSON をログに出して読む。終了コードが 0 でなければ止める。
          function Read-Output($Text) {
              $code = $LASTEXITCODE
              Write-Host $Text
              if ($code -ne 0) { throw "exit code $code" }
              $Text | ConvertFrom-Json
          }
          # その PR のタグの公開した初回のスクリプトを、引数を付けて走らせる（引数が無ければ、そのタグの cli を入れる）。
          function Invoke-Bootstrap {
              $script = Invoke-RestMethod -UseBasicParsing "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/get-vw$year.ps1"
              $arguments = $args
              Read-Output (& ([scriptblock]::Create($script)) @arguments)
          }
          function Invoke-Installed {
              Read-Output (& $exe $args)
          }
          function Get-UserPath {
              $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
              try {
                  if ($null -eq $key.GetValue('Path')) { return $null }
                  [pscustomobject]@{
                      Kind  = $key.GetValueKind('Path')
                      Value = $key.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                  }
              }
              finally { $key.Dispose() }
          }
          function Set-UserPath($Value, $Kind) {
              $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
              try { $key.SetValue('Path', $Value, $Kind) }
              finally { $key.Dispose() }
          }
          function Assert-UserPath($Value, $Kind) {
              $got = Get-UserPath
              "Path: $($got.Kind) $($got.Value)"
              if ($null -eq $got -or $got.Kind -ne $Kind -or $got.Value -ne $Value) {
                  throw "expected Path: $Kind $Value"
              }
          }
          function Get-MovedCli {
              @(Get-ChildItem -LiteralPath (Join-Path $work 'old') -Filter "vw$year.exe.old-*" -File -ErrorAction SilentlyContinue)
          }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\helpers.ps1"
      # latest を入れる手順 7 を走らせるか。PR の CLI が読めるのは PR のマニフェストと同じ manifest_version
      # なので、latest にマニフェストが無い・版が違う（manifest_version を上げる PR）ときは飛ばす。
      - id: latest
        shell: bash
        run: |
          set -eu
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          pr="$(curl -fsSL --retry 4 --retry-delay 5 "$base/download/$TAG/vw$YEAR.json" | jq .manifest_version)"
          latest="$(curl -fsSL "$base/latest/download/vw$YEAR.json" 2>/dev/null | jq .manifest_version || true)"
          echo "manifest_version: PR $pr, latest ${latest:-none}"
          if [ "$latest" = "$pr" ]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi
      # 1. 利用者の Path の値を消し、初回のスクリプトと同じ入り方で入れる。Path は REG_EXPAND_SZ の
      #    <Plug-Ins>\cli\bin だけになる。
      - name: install from the first-time script
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          Remove-ItemProperty -Path HKCU:\Environment -Name Path -ErrorAction SilentlyContinue
          $out = Invoke-Bootstrap
          if ($out.outcome -ne 'installed' -or $out.tag -ne $env:TAG) { throw 'not installed' }
          Assert-UserPath $bin ([Microsoft.Win32.RegistryValueKind]::ExpandString)
          $version = (Get-Content -Raw (Join-Path $plugins 'cli\build.json') | ConvertFrom-Json).version
          if ($version -ne $env:VERSION) { throw "build.json: $version" }
      # 2. 実物のレジストリで、Path の型と既存の項目が保たれる。同じタグの install はフックだけを走らせ、
      #    付け替えないので CLI をよけない。
      - name: keep the kind and the entries of Path
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          Set-UserPath 'C:\vw2026-probe-sz' ([Microsoft.Win32.RegistryValueKind]::String)
          $out = Invoke-Installed install "cli@$env:TAG"
          if ($out.outcome -ne 'up_to_date') { throw 'not up_to_date' }
          Assert-UserPath "C:\vw2026-probe-sz;$bin" ([Microsoft.Win32.RegistryValueKind]::String)
          # 項目を展開せずに残し、末尾の ; に区切りを重ねない。
          Set-UserPath '%USERPROFILE%\vw2026-path-probe;' ([Microsoft.Win32.RegistryValueKind]::ExpandString)
          $out = Invoke-Installed install "cli@$env:TAG"
          if ($out.outcome -ne 'up_to_date') { throw 'not up_to_date' }
          Assert-UserPath "%USERPROFILE%\vw2026-path-probe;$bin" ([Microsoft.Win32.RegistryValueKind]::ExpandString)
          # 置き直さずにもう一度走らせても同じ値のまま。
          $out = Invoke-Installed install "cli@$env:TAG"
          if ($out.hook.path -ne 'exists') { throw "hook: $($out.hook.path)" }
          Assert-UserPath "%USERPROFILE%\vw2026-path-probe;$bin" ([Microsoft.Win32.RegistryValueKind]::ExpandString)
      # 3. 入った PR の CLI で uninstall cli は、何も変えずに 2 で終わり、入っているタグの初回のスクリプトを示す。
      - name: uninstall with the installed CLI is refused
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          # Windows PowerShell 5.1 は、Stop のときに exe の標準エラーを止まる誤りにするので、この呼び出しだけ
          # Continue にする（標準エラーには、案内の文言が出る）。
          $ErrorActionPreference = 'Continue'
          $text = & $exe uninstall cli 2>&1 | ForEach-Object { if ($_ -is [System.Management.Automation.ErrorRecord]) { Write-Host "stderr: $_" } else { $_ } }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host $text
          $out = $text | ConvertFrom-Json
          if ($code -ne 2 -or $out.outcome -ne 'failed' -or $out.command -notlike "*download/$env:TAG/get-vw$env:YEAR.ps1))) uninstall") {
              throw "exit code $code"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $plugins "cli\vw$year-install.json"))) { throw 'cli is removed' }
          # 2 で終わったのが正しいので、ステップの終了コード（$LASTEXITCODE）を戻す。
          $global:LASTEXITCODE = 0
      # 4. 入った PR の CLI で、記録のタグを違うものにしてから同じビルドを入れ直す。動いている自分を
      #    <Work>\old\ へよけてフォルダを付け替え、よけた自分（動いている）は残る。
      - name: install with the installed CLI moves it aside
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $recordPath = Join-Path $plugins "cli\vw$year-install.json"
          $record = Get-Content -Raw -LiteralPath $recordPath | ConvertFrom-Json
          $record.tag = 'dev-previous'
          # BOM を付けずに書く（Set-Content -Encoding UTF8 は BOM を付け、Go の JSON が読めない）。
          [IO.File]::WriteAllText($recordPath, ($record | ConvertTo-Json -Depth 5))
          $out = Invoke-Installed install "cli@$env:TAG"
          if (-not (Test-Path -LiteralPath (Join-Path $work 'old'))) { throw "no work folder $work" }
          if ($out.outcome -ne 'installed') { throw 'not installed' }
          if ((Get-MovedCli).Count -ne 1) { throw "moved: $((Get-MovedCli).Name -join ', ')" }
          if (Test-Path -LiteralPath (Join-Path $work 'old\cli')) { throw 'old\cli is left' }
      # 5. 手順 3 が示した形で、その PR のタグの初回のスクリプトに uninstall を渡す（その PR の CLI が
      #    フォルダの外で外す）。フォルダを消し、Path からは <Plug-Ins>\cli\bin だけが除かれ、手順 4 の残り
      #    （そのプロセスは終わっている）も消えて、何も残らない。指定（既定と同じ場所の --plugins-dir）は
      #    uninstall の前に書く（スクリプトが uninstall cli の後ろへ回す）。
      - name: uninstall with the first-time script
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $out = Invoke-Bootstrap --plugins-dir $plugins uninstall
          if ($out.outcome -ne 'uninstalled' -or @($out.left).Count -ne 0) { throw 'not uninstalled cleanly' }
          if (Test-Path -LiteralPath (Join-Path $plugins 'cli')) { throw 'cli is left' }
          Assert-UserPath '%USERPROFILE%\vw2026-path-probe' ([Microsoft.Win32.RegistryValueKind]::ExpandString)
          if ((Get-MovedCli).Count -ne 0) { throw 'the moved CLI is left' }
      # 6. 初回のスクリプトで入れ直す。
      - name: install again from the first-time script
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $out = Invoke-Bootstrap
          if ($out.outcome -ne 'installed') { throw 'not installed' }
      # 7. 入った PR の CLI で install cli@latest。PR の Go のコードが動いている自分をよけて、フォルダを
      #    latest のものに付け替える。比べるのはどちらも build.json の version（タグの形は版の付け方で変わる）。
      - name: install latest with the installed CLI
        if: steps.latest.outputs.install == 'true'
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $out = Invoke-Installed install cli@latest
          if ($out.outcome -ne 'installed') { throw 'not installed' }
          $version = (Get-Content -Raw (Join-Path $plugins 'cli\build.json') | ConvertFrom-Json).version
          $cli = Invoke-Installed version
          if ($cli.version -ne $version) { throw "vw2026 version $($cli.version), build.json $version" }
          if ($version -eq $env:VERSION) { throw "latest is the PR build $version" }
          if ((Get-MovedCli).Count -eq 0) { throw 'the CLI was not moved' }
          if (Test-Path -LiteralPath (Join-Path $work 'old\cli')) { throw 'old\cli is left' }

  # install-windows-editions の結果を 1 つのチェックにまとめる（必須のチェック）。PR のプレリリースを公開したときは
  # release と install-windows-editions が成功したこと、それ以外（main・マージキュー・fork の PR）は
  # install-windows-editions が飛ばされたことを確かめる。前のジョブが失敗・中止しても飛ばされないよう always() で
  # 走らせる。
  install-windows:
    needs: [meta, release, install-windows-editions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          META: ${{ needs.meta.result }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
          RELEASE: ${{ needs.release.result }}
          INSTALL: ${{ needs.install-windows-editions.result }}
        run: |
          set -eu
          echo "event: $EVENT, meta: $META, publish: $PUBLISH, release: $RELEASE, install: $INSTALL"
          test "$META" = success
          if [ "$EVENT" = pull_request ] && [ "$PUBLISH" = true ]; then
            test "$RELEASE" = success
            test "$INSTALL" = success
          else
            test "$INSTALL" = skipped
          fi
