name: cleanup-dev-release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# PR が閉じたら、その PR のプレリリース（dev-<slug>-<PR 番号>-<短い sha>）をリリースとタグごとすべて
# 消す（docs/plugin/build-and-release.md「CI」）。タグは push ごとに新しく付くので、末尾の
# -<PR 番号>-<短い sha> で見分ける（ブランチの名前が変わって slug が違うものも含む）。push で止められた
# release の下書きはまだタグが無いので、リリースの一覧からタグ名で見分けて消す。
jobs:
  cleanup:
    # プレリリースを作るのは同じリポジトリの PR だけ。
    if: github.event.pull_request.head.repo.full_name == github.repository
    # build.yml と同じグループで走り、その PR の走っているビルドを止めてから消す（消したあとに
    # 公開されない）。グループの式は build.yml と同じものにする（片方だけ変えると同じグループに
    # 入らない）。PR では PR 番号になる。github.ref で組むと、マージで閉じた PR では main になり、
    # main の push のビルドを止めて main のリリースが作られない。ジョブの段に置き、片付けが走るとき
    # （同じリポジトリの PR）だけグループを取る。
    concurrency:
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # 形は scripts/dev-tag.sh が作るもの（slug が空なら dev-<PR 番号>-<短い sha>）。build.yml が下書きを
      # 見分けるのと同じ形で当てる。
      - run: |
          set -eu
          api="repos/$GH_REPO"
          # 頁ごとに絞るので、頁を合わせない（gh の --jq。値は環境変数で渡す）。$ENV は jq の式で、
          # シェルに展開させない。
          export PATTERN="^dev-(.*-)?$PR_NUMBER-[0-9a-f]{7}\$"
          # 下書きを含むリリース。消してもタグは残るので、タグは次で消す。
          # shellcheck disable=SC2016
          gh api --paginate "$api/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test($ENV.PATTERN)) | "\(.id) \(.tag_name)"' |
            while read -r id tag; do
              gh api -X DELETE "$api/releases/$id"
              echo "removed the release $tag"
            done
          # shellcheck disable=SC2016
          gh api --paginate "$api/git/matching-refs/tags/dev-" \
            --jq '.[] | .ref | ltrimstr("refs/tags/") | select(test($ENV.PATTERN))' |
            while read -r tag; do
              gh api -X DELETE "$api/git/refs/tags/$tag"
              echo "removed the tag $tag"
            done
