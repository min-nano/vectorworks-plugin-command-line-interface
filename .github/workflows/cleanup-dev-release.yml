name: cleanup-dev-release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# PR が閉じたら、その PR のプレリリース（dev-<slug>）とタグを消す（docs/plugin/build-and-release.md「CI」）。
# build.yml と同じグループで走り、その PR の走っているビルドを止めてから消す（消したあとに公開されない）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    # プレリリースを作るのは同じリポジトリの PR だけ。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      # タグの名前を作るスクリプトだけを、ビルドしたのと同じ head から取る。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/dev-tag.sh
          sparse-checkout-cone-mode: false
      - run: |
          set -eu
          tag="$(scripts/dev-tag.sh "$BRANCH")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
          fi
          echo "removed $tag"
