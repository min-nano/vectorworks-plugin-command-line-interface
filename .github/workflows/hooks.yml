name: hooks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# cli のフック（scripts/hooks/）のテスト（docs/plugin/install-and-update.md「テスト」）。フックが
# 走るのと同じもの（mac の /bin/sh・Windows PowerShell 5.1）で走らせる。どちらも HOME と
# VW2026_HOOK_* に一時ディレクトリを渡し、Windows は利用者の Path を偽の置き場所に替えるので、
# ランナーの利用者の場所に触れない。必須のチェックにできるよう、パスで絞らない。
jobs:
  sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: /bin/sh tests/hooks/hooks_test.sh

  powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      # Windows に入っている Pester 3.4 ではなく、scripts/powershell.ps1 が固定した版を入れて使う。
      - run: powershell -NoProfile -File scripts/powershell.ps1 -Mode Install
      - run: powershell -NoProfile -File scripts/powershell.ps1 -Mode Test tests/hooks/Hooks.Tests.ps1
