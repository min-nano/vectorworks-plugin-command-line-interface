name: hooks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# cli のフック（scripts/hooks/）のテスト（docs/plugin/install-and-update.md「テスト」）。フックが
# 実行されるのと同じもの（mac の /bin/sh・Windows PowerShell 5.1）で実行する。いずれも
# VW<版>_HOOK_*（2026 と 2025）に一時ディレクトリを渡し、mac は HOME も一時ディレクトリにし、
# Windows は利用者の Path を擬似の配置場所に差し替えるため、ランナーの利用者の場所に触れない。必須の
# チェックにできるよう、パスで絞り込まない。
jobs:
  sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: /bin/sh tests/hooks/hooks_test.sh

  powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      # Windows に導入されている Pester 3.4 ではなく、scripts/powershell.ps1 が固定した版を
      # インストールして使用する。使用しない PSScriptAnalyzer はインストールしない。
      - run: powershell -NoProfile -File scripts/powershell.ps1 -Mode Install -Module Pester
      - run: powershell -NoProfile -File scripts/powershell.ps1 -Mode Test tests/hooks/Hooks.Tests.ps1
