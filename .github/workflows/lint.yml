name: lint

# Style and static checks. scripts/lint.sh runs the same checks locally.
#   * format              - treefmt --ci: every formatter (treefmt.toml: clang-format,
#                           cmake-format, gofmt, shfmt, ruff format) must leave the
#                           tree unchanged
#   * clang-tidy          - static analysis of the SDK-free code (src/core/)
#   * cmake-lint          - bug-prone CMake patterns
#   * actionlint          - the workflows (and shellcheck on their run: scripts)
#   * shellcheck          - scripts/*.sh
#   * yamllint            - YAML structure (.yamllint.yaml)
#   * editorconfig        - final newline, trailing whitespace, UTF-8, LF, line length
# PSScriptAnalyzer joins when the first PowerShell script does
# (docs/plugin/plan.md, step 5). go vet and the Go tests run in cli.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_VERSION: "18"
  CMAKELANG_VERSION: "0.6.13"
  TREEFMT_VERSION: "2.6.0"
  # sha256 of treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz (the release's checksums.txt)
  TREEFMT_SHA256: "2deff4c0f381d560784c5632cf5860da712891ccd9185306e73d8ba37778ab7f"
  SHFMT_VERSION: "v3.14.1"
  RUFF_VERSION: "0.16.10"
  YAMLLINT_VERSION: "1.38.0"
  ACTIONLINT_VERSION: "v1.7.12"
  EDITORCONFIG_CHECKER_VERSION: "v3.8.0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The formatters, at the versions this repository is formatted with.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-format-${CLANG_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v "clang-format-${CLANG_VERSION}")" "$RUNNER_TEMP/bin/clang-format"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cmakelang==${CMAKELANG_VERSION}" pyyaml "ruff==${RUFF_VERSION}"
      # gofmt comes with Go: the version cli.yml builds with.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Install shfmt
        run: |
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install treefmt
        run: |
          archive="treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}/$archive"
          echo "${TREEFMT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" treefmt
      - name: Check formatting
        run: treefmt --ci

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-tidy-${CLANG_VERSION}"
      - name: Configure (compile database, no SDK)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVW_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          "clang-tidy-${CLANG_VERSION}" -p build --warnings-as-errors='*' src/core/*.cpp

  cmake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cmakelang==${CMAKELANG_VERSION}" pyyaml
      - run: cmake-lint CMakeLists.txt tests/CMakeLists.txt tests/fuzz/CMakeLists.txt

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: '"$(go env GOPATH)/bin/actionlint" -color'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yamllint==${YAMLLINT_VERSION}"
      - run: yamllint --strict .

  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install "github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@${EDITORCONFIG_CHECKER_VERSION}"
      - run: '"$(go env GOPATH)/bin/editorconfig-checker"'
