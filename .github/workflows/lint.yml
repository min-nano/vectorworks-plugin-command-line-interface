name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            cli/go.sum
      # ランナーに入っている shellcheck は版が決まらないので、版を指定して取る。
      - name: shellcheck
        run: |
          set -eu
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"
      - run: scripts/lint.sh
