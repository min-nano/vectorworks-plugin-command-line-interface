name: lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go vet はビルドと同じ cli/go.mod の Go で動かす。ツールは手元と同じく、tools/go.mod の Go へ
      # go が切り替えて動かす（GOTOOLCHAIN=auto）。
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            tools/go.sum
            cli/go.sum
      # ランナーに入っている shellcheck は版が決まらないので、版を指定して取り、中身を照合する。
      - name: shellcheck
        run: |
          set -eu
          dir="$RUNNER_TEMP/shellcheck"
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"
      - run: scripts/lint.sh
        env:
          GOTOOLCHAIN: auto
