name: lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Go・clang-tidy・shellcheck・PSScriptAnalyzer（format.yml と同じ準備）。
      - uses: ./.github/actions/setup-checks
      - run: scripts/lint.sh
        env:
          GOTOOLCHAIN: auto
