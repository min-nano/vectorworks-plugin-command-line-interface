version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: daily
  # .github/actions/ の composite action も同じ PR で更新する（groups が無いと、ディレクトリごとに
  # 別の PR になり、両方がマージされるまでワークフローと composite action で版が食い違う）。
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily
  # clang-format と clang-tidy は同じ版に統一する（docs/lint.md）ため、1 つの PR で更新する。2 つは
  # PyPI の別のパッケージで版の公開される時期が異なり、片方のみを更新した PR も作成されうる。
  # その PR は format.sh・lint.sh が停止させる（scripts/common.sh）ため、もう片方の版が公開され、
  # この PR が両方を更新する形になるまでマージしない。
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: daily
    groups:
      llvm:
        patterns: ["clang-*"]
  # 自動レビューの Claude Agent SDK（scripts/review/requirements.txt。推移的な依存も固定している）。
  - package-ecosystem: pip
    directory: /scripts/review
    schedule:
      interval: weekly
  # 自動レビューの code-review プラグイン（docs/review.md）。取得元（anthropics/claude-plugins-official）
  # には tag も release も無いため、submodule（.github/claude-plugins-official）で commit を固定し、main の
  # 最新の commit へ更新させる。上流は 1 日に複数回更新され、code-review に関係しない変更でも更新される
  # ため、週 1 回とする。更新した commit にプラグインが存在するかは review.yml の plugin ジョブが確認する。
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
