version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: daily
  # .github/actions/ の composite action も同じ PR で上げる。
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily
  # clang-format と clang-tidy は同じ版にそろえる（docs/lint.md）ので、1 つの PR で上げる。2 つは PyPI の別の
  # パッケージで版の出る時期が違い、片方だけを上げた PR もできる。その PR は format.sh・lint.sh が止める
  # （scripts/common.sh）ので、もう片方の版が出て、この PR が両方を上げる形になるまでマージしない。
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: daily
    groups:
      llvm:
        patterns: ["clang-*"]
