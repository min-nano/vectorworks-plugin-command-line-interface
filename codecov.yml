# Keep this file ASCII: the Codecov uploader on Windows reads it as cp1252.
# Go writes coverage with module paths (github.com/<owner>/<repo>/cli/...);
# map them to paths in the repository.
fixes:
  - "github.com/min-nano/vectorworks-plugin-command-line-interface/::"
# The fake plugin is test code; keep the numbers about production code only.
ignore:
  - "cli/internal/fakeplugin"
# Report only after all four coverage uploads for a commit have arrived (go.yml and
# cpp.yml, each on macOS and Windows). Some lines run on one OS only, so a status
# sent after the first upload marks codecov/patch as failed, and the merge queue
# drops the pull request on that first failure.
codecov:
  notify:
    after_n_builds: 4
